name: "Build And Release"

on:
  push:
    branches:
      - release*
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Get version
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: |
          cd packages/core && pnpm test
          cd ../mitmproxy && pnpm test

      - name: Build Electron
        working-directory: packages/gui
        run: npm run electron:build

      # 自动重命名所有包
      - name: Rename Windows files
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd packages/gui/dist_electron
          Get-ChildItem -Filter "*.exe" | Rename-Item -NewName { $_.Name -replace 'DevSidecar-.*?-x64','DevSidecar-${{ steps.package-info.outputs.version }}-windows-x86_64' }
          Get-ChildItem -Filter "*.exe" | Rename-Item -NewName { $_.Name -replace 'DevSidecar-.*?-arm64','DevSidecar-${{ steps.package-info.outputs.version }}-windows-arm64' }

      - name: Rename Linux files
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/gui/dist_electron
          rename -f 's/DevSidecar-.*?-amd64/DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64/' *.deb
          rename -f 's/DevSidecar-.*?-x86_64/DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64/' *.AppImage
          rename -f 's/DevSidecar-.*?-arm64/DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64/' *.deb
          rename -f 's/DevSidecar-.*?-arm64/DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64/' *.AppImage

      - name: Rename macOS files
        if: matrix.os == 'macos-latest'
        run: |
          cd packages/gui/dist_electron
          mv *.dmg DevSidecar-${{ steps.package-info.outputs.version }}-macos-x86_64.dmg 2>/dev/null || true

      # 🔥 关键：每个系统只上传一个文件夹
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: packages/gui/dist_electron/

  # 🔥 发布任务：自动收集所有包，一键发布
  download-and-release:
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: ./all-builds

      # 自动把所有安装包集中到 release 目录
      - name: Collect all files
        run: |
          mkdir release
          find all-builds -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -lh release/

      # 🔥 最终：自动创建 Release，所有包自动上传
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.package-info.outputs.version }}
          name: DevSidecar ${{ steps.package-info.outputs.version }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
