name: "Build And Release"

on:
  push:
    branches:
      - release*
    paths-ignore:
      - "_script/**"
      - "doc/**"
      - "**/*.md"
      - "**/.gitignore"
      - "**/LICENSE"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        node: [22]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.7
        with:
          submodules: true
          fetch-depth: 0

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: "pnpm install"
        run: pnpm install

      - name: "Run tests"
        run: |
          cd packages/core && pnpm run test
          cd ../mitmproxy && pnpm run test

      - name: "Build Electron App"
        working-directory: packages/gui
        run: npm run electron:build

      - name: "Rename artifacts - Windows"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          cd packages/gui/dist_electron
          if (Test-Path "DevSidecar-${{ steps.package-info.outputs.version }}-x64.exe") { ren "DevSidecar-${{ steps.package-info.outputs.version }}-x64.exe" "DevSidecar-${{ steps.package-info.outputs.version }}-windows-x86_64.exe" }
          if (Test-Path "DevSidecar-${{ steps.package-info.outputs.version }}-ia32.exe") { ren "DevSidecar-${{ steps.package-info.outputs.version }}-ia32.exe" "DevSidecar-${{ steps.package-info.outputs.version }}-windows-ia32.exe" }
          if (Test-Path "DevSidecar-${{ steps.package-info.outputs.version }}-arm64.exe") { ren "DevSidecar-${{ steps.package-info.outputs.version }}-arm64.exe" "DevSidecar-${{ steps.package-info.outputs.version }}-windows-arm64.exe" }

      - name: "Rename artifacts - Linux"
        if: matrix.os == 'ubuntu'
        run: |
          cd packages/gui/dist_electron
          mv DevSidecar-*-amd64.deb DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.deb || true
          mv DevSidecar-*-x86_64.AppImage DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.AppImage || true
          mv DevSidecar-*-arm64.deb DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64.deb || true

      - name: "Rename artifacts - macOS"
        if: matrix.os == 'macos'
        run: |
          cd packages/gui/dist_electron
          mv DevSidecar-*-x64.dmg DevSidecar-${{ steps.package-info.outputs.version }}-macos-x86_64.dmg || true
          mv DevSidecar-*-arm64.dmg DevSidecar-${{ steps.package-info.outputs.version }}-macos-arm64.dmg || true

      # 🔥 关键修复：只上传一个文件夹，而不是分开上传每个文件
      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: packages/gui/dist_electron/
          if-no-files-found: error

  download-and-release:
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.7

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      # 🔥 关键修复：把所有子目录里的文件提取出来
      - name: "Flatten all files"
        run: |
          mkdir -p release
          find ./artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -lah release/

      - name: "Create draft release"
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.package-info.outputs.version }}
          name: DevSidecar ${{ steps.package-info.outputs.version }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
