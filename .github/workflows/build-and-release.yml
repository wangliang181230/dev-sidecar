name: "Build And Release"

on:
  push:
    branches:
      - release*
    paths-ignore:
      - "_script/**"
      - "doc/**"
      - "**/*.md"
      - "**/.gitignore"
      - "**/LICENSE"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        node: [22]

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          submodules: true
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Install Linux build deps"
        if: ${{ matrix.os == 'ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            rpm \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libnss3-dev \
            libasound2-dev

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - run: pnpm install

      - name: "Build Electron"
        working-directory: packages/gui
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            npm run electron:build -- --win --x64 --ia32 --arm64
          elif [[ "${{ matrix.os }}" == "ubuntu" ]]; then
            npm run electron:build -- --linux --x64 --arm64 --armv7l
          else
            npm run electron:build -- --mac --x64 --arm64 --universal
          fi

      - name: "Rename artifacts"
        working-directory: packages/gui/dist_electron
        run: |
          VERSION="${{ steps.package-info.outputs.version }}"

          if [[ "${{ matrix.os }}" == "windows" ]]; then
            mv DevSidecar-${VERSION}-x64.exe           DevSidecar-${VERSION}-windows-x86_64.exe 2>/dev/null || true
            mv DevSidecar-${VERSION}-ia32.exe           DevSidecar-${VERSION}-windows-ia32.exe 2>/dev/null || true
            mv DevSidecar-${VERSION}-arm64.exe          DevSidecar-${VERSION}-windows-arm64.exe 2>/dev/null || true
            mv DevSidecar-${VERSION}.exe                DevSidecar-${VERSION}-windows-universal.exe 2>/dev/null || true
          fi

          if [[ "${{ matrix.os }}" == "ubuntu" ]]; then
            mv DevSidecar-${VERSION}-x86_64.deb        DevSidecar-${VERSION}-linux-x86_64.deb 2>/dev/null || true
            mv DevSidecar-${VERSION}-x86_64.AppImage    DevSidecar-${VERSION}-linux-x86_64.AppImage 2>/dev/null || true
            mv DevSidecar-${VERSION}-x86_64.rpm         DevSidecar-${VERSION}-linux-x86_64.rpm 2>/dev/null || true
            mv DevSidecar-${VERSION}-arm64.deb          DevSidecar-${VERSION}-linux-arm64.deb 2>/dev/null || true
            mv DevSidecar-${VERSION}-armv7l.deb         DevSidecar-${VERSION}-linux-armv7l.deb 2>/dev/null || true
          fi

          if [[ "${{ matrix.os }}" == "macos" ]]; then
            mv DevSidecar-${VERSION}-x64.dmg           DevSidecar-${VERSION}-macos-x86_64.dmg 2>/dev/null || true
            mv DevSidecar-${VERSION}-arm64.dmg         DevSidecar-${VERSION}-macos-arm64.dmg 2>/dev/null || true
            mv DevSidecar-${VERSION}-universal.dmg     DevSidecar-${VERSION}-macos-universal.dmg 2>/dev/null || true
          fi

          ls -lah

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: packages/gui/dist_electron/*
          if-no-files-found: error

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - name: "Cleanup old artifacts"
        uses: kolpasha/delete-old-artifacts@v1
        with:
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          age: "7 days"
          skip-tags: true

  download-and-release:
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - uses: actions/checkout@v4.1.7

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - run: mkdir -p release

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: "Flatten artifacts"
        run: |
          cd release
          find . -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.dmg" \) -exec cp {} . \;
          rm -rf windows-* ubuntu-* macos-*
          ls -lah

      - name: "Create Draft Release"
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.package-info.outputs.version }}-myself
          name: DevSidecar ${{ steps.package-info.outputs.version }}
          files: |
            release/*
